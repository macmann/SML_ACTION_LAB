services:
  app:
    build: .
    expose: ["3000"]
    volumes:
      - slm_data:/app/data
    restart: unless-stopped
    init: true
    cpus: 2.0
    mem_limit: 3g
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health/live',{signal:AbortSignal.timeout(3000)}).then(r=>{if(!r.ok)process.exitCode=1}).catch(()=>{process.exitCode=1})"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  slm_data:
